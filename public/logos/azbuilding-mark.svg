<svg width="50" height="52" viewBox="0 0 50 52" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AZBUILDING mark">
  <!-- Architectural "A": left ramp/bridge + right stepped tower, joined by a
       crossbar. Explicit colours (white + orange accent) so it stays visible
       when loaded as an <img> on the dark header. Replace with the official
       brand SVG when available. -->
  <g fill="none" stroke="#F8FAFC" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter">
    <!-- left ramp (two parallel beams) -->
    <path d="M5 49 L25 5" />
    <path d="M11 49 L27 9" />
    <!-- right tower edge -->
    <path d="M25 5 L44 49" />
    <!-- stepped tower ticks on the right -->
    <path d="M30 18 L35 18" />
    <path d="M33 27 L39 27" />
    <path d="M36 36 L42 36" />
    <path d="M39 44 L45 44" />
    <!-- crossbar (two parallel beams) -->
    <path d="M13 33 L40 33" />
    <path d="M14 37 L41 37" />
  </g>
  <!-- dashed ramp centre line -->
  <path d="M8 49 L26 7" stroke="#F8FAFC" stroke-width="1" stroke-dasharray="2 3" opacity="0.8" />
  <!-- orange structural node where the crossbar meets the ramp -->
  <rect x="11.5" y="31.5" width="4.2" height="4.2" fill="#EA580C" />
</svg>
